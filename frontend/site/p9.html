<script>
(function(){
'use strict';
const T = window.TOTEM; const { $, $$, S } = T;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* =========================== EXPLORE =========================== */
// The search index names what exists. It used to list a Totem Genesis collection of 2,222,
// four games and five Totems owned by invented accounts, none of which are on chain.
const INDEX = [
  ['Token', '$TOTEM', 'NEP-141 at token.totemtest.testnet, 1,000,000,000 supply', '#explore'],
  ['Collection', 'Totem', 'NEP-171 at nft.totemtest.testnet, 10,000 Totems', '#explore'],
  ['Arena', 'Totem Arena', 'Entry is checked against the $TOTEM you hold on chain', '#arenas'],
  ['Game', 'Meme Kart', 'Race 3 laps. Finishing pays a prize from the Arena prize account', '#play'],
  ['Claim', 'Faucet', 'Sends 25,000 $TOTEM, one piece, to your wallet', '#profile'],
  ['Claim', 'Mint permit', 'Totem signs the permit, you mint the Totem yourself', '#profile'],
  ['Profile', 'Your holdings', 'Read from NEAR: balance, pieces and the Totem you own', '#profile']
];
function searchPaint(q){
  const box = $('#exResults'); q = q.trim().toLowerCase();
  if (!q) { box.innerHTML = ''; $('#exBody').hidden = false; return; }
  $('#exBody').hidden = true;
  const hits = INDEX.filter((r) => (r[1] + ' ' + r[2] + ' ' + r[0]).toLowerCase().includes(q));
  if (!hits.length) { box.innerHTML = '<div class="card" style="max-width:760px"><p><strong>Nothing on Totem matches “' + esc(q) + '” yet.</strong></p><p class="muted">Totem is the only community live right now. New tokens, collections and Arenas show up here the day they launch.</p></div>'; return; }
  box.innerHTML = '<div class="grid" style="max-width:760px;gap:8px">' + hits.map((r) => '<a class="door" href="' + r[3] + '" style="text-decoration:none"><span><strong>' + esc(r[1]) + '</strong><br><span class="muted" style="font-size:14px">' + esc(r[2]) + '</span></span><span class="chip">' + r[0] + '</span></a>').join('') + '</div>';
}
$('#exSearch').addEventListener('input', (e) => searchPaint(e.target.value));
function section(title, note, inner){ return '<section style="margin-top:44px"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:14px"><h2 style="font-size:clamp(32px,4.5vw,44px);line-height:1">' + title + '</h2>' + (note ? '<span class="muted" style="font-size:14px">' + note + '</span>' : '') + '</div>' + inner + '</section>'; }
// Explore used to advertise things that did not exist: a free starter claimed with an
// email, a share of 400 NEAR, Gold Wings "this week", 1,312 players, 412 holders, 31.2M
// locked, and a "Totem Genesis" collection of 2,222 NFTs when the deployed collection is
// called Totem and holds 10,000. Every number here now comes from /api/v1/platform, which
// reads the contracts, so the page cannot drift from the chain.
async function paintExplore(){
  const body = $('#exBody');
  body.innerHTML = '<p class="muted" style="margin-top:24px">Reading the contracts...</p>';
  const response = await T.api.get('/platform');
  const p = response.ok ? response.data.platform : null;
  if (!p || p.source !== 'chain') {
    body.innerHTML = '<div class="card" style="max-width:760px;margin-top:24px"><p style="margin:0"><strong>NEAR could not be reached just now.</strong></p><p class="muted" style="margin:8px 0 0">Nothing is shown rather than a number that might be wrong.</p></div>';
    return;
  }
  const arenaResponse = await T.api.get('/arenas/totem');
  const arena = arenaResponse.ok ? arenaResponse.data.arena : null;
  const full = p.piece * p.maxPieces;

  const stat = (label, value, note) => '<div class="card" style="display:flex;flex-direction:column;gap:4px"><span class="muted" style="font-size:13px">' + label + '</span><span style="font-family:var(--serif);font-size:30px;line-height:1.05">' + value + '</span><span class="muted" style="font-size:13px">' + note + '</span></div>';

  const whatItIs = '<div class="grid g4">' +
    stat('Collection', esc(p.collection.name), T.fmt(p.collection.minted) + ' minted of ' + T.fmt(p.collection.maxSupply)) +
    stat('Token supply', T.fmt(Number(p.token.totalSupply)), '$' + esc(p.collection.symbol) + ', ' + p.token.decimals + ' decimals') +
    stat('A full Totem', T.fmt(full), p.maxPieces + ' pieces of ' + T.fmt(p.piece)) +
    stat('Royalties', (p.collection.creatorRoyaltyBps / 100) + '% + ' + (p.collection.treasuryRoyaltyBps / 100) + '%', 'creator and treasury, on every sale') +
    '</div>';

  const allocations = '<div class="tbl"><table><thead><tr><th>Allocation</th><th>Account</th><th>$TOTEM held now</th></tr></thead><tbody>' +
    p.allocations.map((a) => '<tr><td style="text-transform:capitalize">' + esc(a.account.split('.')[0]) + '</td><td style="font-family:var(--mono);font-size:13px;word-break:break-all">' + esc(a.account) + '</td><td>' + T.fmt(Number(a.whole)) + '</td></tr>').join('') +
    '</tbody></table></div><p class="muted" style="font-size:13px;margin-top:8px">Query any of these yourself with ft_balance_of on ' + esc(p.token.contractId) + '.</p>';

  const arenaHtml = !arena ? '' : '<a class="card ink" href="#arenas" style="text-decoration:none;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between">' +
    '<span style="display:flex;gap:16px;align-items:center"><span style="font-family:var(--serif);font-size:44px;line-height:1">1</span><span><span style="font-family:var(--serif);font-size:30px;line-height:1">' + esc(arena.name) + '</span><br><span class="muted" style="font-size:14px">' + (arena.paused ? 'Paused by its operator' : 'Open') + '</span></span></span>' +
    '<span style="display:flex;gap:18px;flex-wrap:wrap;font-size:14px"><span>Entry <strong>' + (arena.entryPieces ?? 1) + '</strong> piece(s)</span><span><strong>' + T.fmt((arena.entryPieces ?? 1) * p.piece) + '</strong> $TOTEM to enter</span></span></a>';

  const actions = [
    ['Claim $TOTEM', 'The faucet sends ' + T.fmt(p.piece) + ', one piece, to your wallet on chain.', '#profile', 'Open profile'],
    ['Claim a Totem', 'Totem signs a mint permit, then you mint it yourself from your own wallet.', '#profile', 'Open profile'],
    ['Race for a prize', 'Finish Meme Kart and collect a prize paid from the Arena prize account.', '#play', 'Race now']
  ];
  const actionHtml = '<div class="grid g3">' + actions.map((a) => '<a class="card" href="' + a[2] + '" style="text-decoration:none;display:flex;flex-direction:column;gap:10px"><span style="font-family:var(--serif);font-size:30px;line-height:1.05">' + a[0] + '</span><span style="color:var(--body)">' + a[1] + '</span><span class="btn small" style="align-self:flex-start;margin-top:auto">' + a[3] + '</span></a>').join('') + '</div>';

  body.innerHTML =
    section('What you can do', 'Every one of these writes to NEAR testnet', actionHtml) +
    section('What Totem is, from the contracts', '', whatItIs) +
    section('Where the supply sits', 'Read from ' + esc(p.token.contractId), allocations) +
    (arenaHtml ? section('Arenas', '', '<div class="grid" style="gap:10px">' + arenaHtml + '</div>') : '') +
    '<p class="muted" style="font-size:13px;margin-top:24px">Read live from ' + esc(p.collection.contractId) + ' and ' + esc(p.token.contractId) + ' on NEAR testnet.</p>';
  searchPaint($('#exSearch').value);
}
T.modules.explore = { enter: paintExplore };

/* =========================== PROFILE =========================== */
function nftsOwned(){
  const list = [{ id: '0417', name: 'Totem #0417', pieces: S.pieces, how: 'Owned', items: ['Gold Wings'] }];
  S.prizes.filter((p) => /^Prize Totem/.test(p)).forEach((p) => list.push({ id: p.replace(/\D/g, ''), name: p.replace('Prize ', ''), pieces: 1, how: 'Won in the Arena', items: [] }));
  if (S.rented) list.push({ id: S.rented.id, name: S.rented.name, pieces: S.rented.pieces, how: 'Rented, ' + (S.rented.term === 'race' ? '1 race' : '7 days'), items: [], rented: true });
  return list;
}
function features(n){
  const p = n.pieces, need = S.entryPieces || 1, out = [], no = [];
  out.push('Holds ' + T.fmt(p * 25000) + ' $TOTEM inside');
  if (p >= need && !S.arenaPaused) out.push('Enters Totem Arena'); else no.push(S.arenaPaused ? 'Totem Arena is paused' : 'Needs ' + need + ' pieces for Totem Arena');
  out.push('Drives in Meme Kart');
  if (p >= 1) out.push('Paints for Moss house, ' + (2 + p * 4) + ' paint'); else no.push('Needs 1 piece to paint');
  if (p >= 1) out.push('Opens the holder room'); else no.push('Needs 1 piece for the holder room');
  if (p >= 3 && !n.rented) out.push('Votes in the treasury room, ' + p + ' votes'); else if (!n.rented) no.push('Needs 3 pieces for the treasury room');
  if (p >= 4) out.push('Qualifies for Hold the Line'); else no.push('Needs a full Totem for Hold the Line');
  if (!n.rented) out.push(S.listing && n.id === '0417' ? 'Listed for rent' : 'Can be lent out');
  n.items.forEach((i) => out.push('Carries ' + i));
  return { out, no };
}
function roles(){
  const r = [];
  if (nftsOwned().length) r.push(['NFT holder', 'g']);
  if (S.races || S.prizes.length) r.push(['Arena player', '']);
  if (S.listing) r.push(['Lender', '']);
  if (S.launches && S.launches.length) r.push(['Launcher', 'e']);
  if (S.games.length) r.push(['Builder', '']);
  if (S.operator) r.push(['Totem Arena operator', 'e']);
  return r;
}
function paintProfile(){
  // This rendered an entire simulated account: invented NFT counts, an invented $TOTEM
  // balance, invented roles, launches and rentals, none of it connected to a wallet or to
  // a chain. A visitor could not tell which parts were real, which is the worst version of
  // a demo. The real profile is rendered from chain state by the wallet part, which appends
  // into this same section straight after this runs, so this only sets the heading.
  const body = $('#profileBody');
  if (body) body.innerHTML = '<div class="ph"><h1>Profile</h1></div>';
  if (T.refreshHoldings) T.refreshHoldings();
}
T.modules.profile = { enter: paintProfile };
})();
</script>
