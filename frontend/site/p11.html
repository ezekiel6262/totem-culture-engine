<style>
.dpad{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(3,60px);gap:6px}
.dpad button{border-radius:16px;border:1.5px solid #000;background:rgba(255,255,255,.92);font-weight:600;font-size:18px;color:#000;touch-action:none}
.timing{position:relative;height:28px;border:1.5px solid #000;border-radius:999px;background:#F6F6F2;overflow:hidden}
.timing .zone{position:absolute;top:0;bottom:0;background:#00B97F}
.timing .mk{position:absolute;top:-2px;bottom:-2px;width:6px;background:#000;border-radius:3px}
.meme{aspect-ratio:1;max-width:340px;width:100%;border:1.5px solid #000;border-radius:16px;background:#fff;position:relative;overflow:hidden}
.meme .t{position:absolute;left:8px;right:8px;text-align:center;font-family:var(--sans);font-weight:700;font-size:clamp(16px,4.6vw,22px);line-height:1.15;text-transform:none}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal span{aspect-ratio:1;border:1.5px solid #000;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
</style>
<script>
(function(){
'use strict';
const T = window.TOTEM; const { $, $$, S } = T;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const gate = () => T.requireArena();
const sec = (n) => Math.floor(n / 1000);

/* ======================= MEME CLASH ======================= */
const TEMPLATES = [
  { id: 'says', name: 'Totem says', top: 'Me after locking', bottom: 'my last 25,000 $TOTEM' },
  { id: 'before', name: 'Before and after', top: 'Wallet', bottom: 'Totem' },
  { id: 'houses', name: 'House versus house', top: 'Moss house', bottom: 'Ember house' }
];
let tpl = 'says', clashPhase = 'make', myVote = null, clashTop = '', clashBottom = '';
function memeArt(id, top, bottom){
  const svg = id === 'says' ? T.svgTotem(4, 120, 'wings') : id === 'before' ? '<div style="display:flex;gap:30px;align-items:center">' + T.svgTotem(0, 80) + T.svgTotem(4, 80) + '</div>' : '<div style="display:flex;gap:30px;align-items:center">' + T.svgTotem(4, 80) + T.svgTotem(4, 80).replace(/#00B97F/g, '#FF5A1F') + '</div>';
  return '<div class="meme"><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:' + (id === 'houses' ? '#FFFBE0' : '#F6F6F2') + '">' + svg + '</div><div class="t" style="top:10px">' + esc(top) + '</div><div class="t" style="bottom:10px">' + esc(bottom) + '</div></div>';
}
const ENTRIES = [['kofi.testnet', 'says', 'POV: the chart is red', 'my Totem is still full', 241], ['weaver.testnet', 'houses', 'Moss house painting', 'Ember house sleeping', 198], ['tunde.testnet', 'before', 'Holding tokens', 'Holding a whole account', 164], ['moremi.testnet', 'says', 'They said sell', 'I said add a piece', 122]];
function paintClash(){
  const root = $('#clashRoot');
  const head = '<div class="ph"><div><span class="muted">Totem Arena</span><h1>Meme Clash</h1></div><div class="seg" role="group" aria-label="Stage">' + [['make', '1 Make'], ['vote', '2 Vote'], ['results', '3 Results']].map((p) => '<button type="button" data-cp="' + p[0] + '" aria-pressed="' + (p[0] === clashPhase) + '">' + p[1] + '</button>').join('') + '</div></div>';
  let body = '';
  if (clashPhase === 'make') {
    const t = TEMPLATES.find((x) => x.id === tpl);
    body = '<div style="display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start"><div style="flex:1 1 300px;max-width:360px" id="clashPrev">' + memeArt(tpl, clashTop || t.top, clashBottom || t.bottom) + '</div>' +
      '<div class="card" style="flex:1 1 340px;display:flex;flex-direction:column;gap:12px"><span class="muted">Template</span><div class="seg" role="group" aria-label="Template">' + TEMPLATES.map((x) => '<button type="button" data-tpl="' + x.id + '" aria-pressed="' + (x.id === tpl) + '">' + x.name + '</button>').join('') + '</div>' +
      '<label class="f">Top text<input type="text" id="mTop" maxlength="60" value="' + esc(clashTop || t.top) + '"></label><label class="f">Bottom text<input type="text" id="mBot" maxlength="60" value="' + esc(clashBottom || t.bottom) + '"></label>' +
      (S.clashEntry ? '<p class="muted">You already entered this round. Submitting again replaces your entry.</p>' : '') + '<button class="btn" type="button" id="mSubmit">Submit my meme</button><span class="muted" style="font-size:13px">Top 3 by holder vote win a Relic item. Votes are weighted by pieces.</span></div></div>';
  } else if (clashPhase === 'vote') {
    const list = ENTRIES.map((e) => ({ who: e[0], tpl: e[1], top: e[2], bot: e[3], votes: e[4] + (myVote === e[0] ? S.pieces : 0) }));
    if (S.clashEntry) list.push({ who: S.account + ' (you)', tpl: S.clashEntry.tpl, top: S.clashEntry.top, bot: S.clashEntry.bot, votes: S.clashEntry.votes, me: true });
    body = '<p style="color:var(--body);margin-bottom:16px">Vote for one entry. Your Totem has ' + S.pieces + ' pieces, so your vote counts ' + S.pieces + ' times. You can’t vote for yourself.</p><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(240px,1fr))">' + list.map((e) => '<div class="card" style="display:flex;flex-direction:column;gap:10px;padding:14px">' + memeArt(e.tpl, e.top, e.bot) + '<div style="display:flex;justify-content:space-between;font-size:14px"><span>' + esc(e.who) + '</span><strong>' + e.votes + ' votes</strong></div>' + (e.me ? '<span class="chip">Your entry</span>' : '<button class="btn small ' + (myVote === e.who ? 'green' : 'ghost') + '" type="button" data-mv="' + esc(e.who) + '">' + (myVote === e.who ? 'Voted with ' + S.pieces : 'Vote') + '</button>') + '</div>').join('') + '</div>' +
      '<button class="btn" type="button" id="mClose" style="margin-top:20px">Close the round (demo)</button>';
  } else {
    const list = ENTRIES.map((e) => ({ who: e[0], votes: e[4] + (myVote === e[0] ? S.pieces : 0) }));
    if (S.clashEntry) list.push({ who: S.account + ' (you)', votes: S.clashEntry.votes, me: true });
    list.sort((a, b) => b.votes - a.votes);
    const rank = list.findIndex((x) => x.me) + 1;
    body = '<div class="tbl lb" style="max-width:640px"><table><thead><tr><th>#</th><th>Entry</th><th style="text-align:right">Votes</th></tr></thead><tbody>' + list.map((x, i) => '<tr' + (x.me ? ' style="background:#FFFBE0"' : '') + '><td>' + (i + 1) + '</td><td>' + esc(x.who) + '</td><td style="text-align:right">' + x.votes + '</td></tr>').join('') + '</tbody></table></div>' +
      (S.clashEntry ? '<div class="card ink" style="margin-top:18px;max-width:640px;display:flex;flex-direction:column;gap:10px"><h2 style="font-size:34px">' + (rank <= 3 ? 'You placed ' + rank + '. Relic won.' : 'You placed ' + rank + '.') + '</h2><p class="muted">' + (rank <= 3 ? 'The Clash Relic is now in your Totem’s inventory.' : 'Top 3 win a Relic. A new round starts every day.') + '</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="button" id="mShare">Share my meme result</button><button class="btn ghost" type="button" id="mNew">Start a new round</button></div></div>' : '<p class="muted" style="margin-top:14px">You didn’t enter this round. <button class="btn small ghost" type="button" id="mNew">Make a meme</button></p>');
    if (S.clashEntry && rank <= 3 && !S.items.includes('Clash Relic')) { S.items.push('Clash Relic'); T.save(); T.sfx('win'); }
  }
  root.innerHTML = head + body;
  $$('[data-cp]').forEach((b) => b.addEventListener('click', () => { clashPhase = b.dataset.cp; paintClash(); }));
  $$('[data-tpl]').forEach((b) => b.addEventListener('click', () => { tpl = b.dataset.tpl; clashTop = ''; clashBottom = ''; paintClash(); }));
  const upd = () => { clashTop = $('#mTop').value; clashBottom = $('#mBot').value; $('#clashPrev').innerHTML = memeArt(tpl, clashTop, clashBottom); };
  if ($('#mTop')) { $('#mTop').addEventListener('input', upd); $('#mBot').addEventListener('input', upd); }
  const sb = $('#mSubmit'); if (sb) sb.addEventListener('click', () => { const tp = $('#mTop').value.trim(), bt = $('#mBot').value.trim(); if (!tp && !bt) { T.toast('Add some text first'); return; } S.clashEntry = { tpl, top: tp, bot: bt, votes: 150 + Math.floor(Math.random() * 120) }; T.save(); T.chain('Meme Clash entry', [{ receiver: 'arena.totemtest.testnet', method: 'submit_entry', args: { game: 'meme-clash', template: tpl, content_hash: 'sha256:...' } }]); T.sfx('piece'); T.toast('Submitted. Now vote on the others.'); clashPhase = 'vote'; paintClash(); });
  $$('[data-mv]').forEach((b) => b.addEventListener('click', () => { myVote = myVote === b.dataset.mv ? null : b.dataset.mv; T.chain('Meme Clash vote', [{ receiver: 'arena.totemtest.testnet', method: 'vote_entry', args: { entry_by: b.dataset.mv, weight: S.pieces } }]); paintClash(); }));
  const cl = $('#mClose'); if (cl) cl.addEventListener('click', () => { clashPhase = 'results'; paintClash(); });
  const nw = $('#mNew'); if (nw) nw.addEventListener('click', () => { S.clashEntry = null; myVote = null; T.save(); clashPhase = 'make'; paintClash(); });
  const sh = $('#mShare'); if (sh) sh.addEventListener('click', () => T.share({ title: 'My meme placed in Meme Clash', stat: S.clashEntry.top.slice(0, 26), line: 'Totem Arena, season 1' }));
}
T.modules.clash = { enter(){ if (gate()) paintClash(); } };

/* ======================= RITUAL RAID ======================= */
const SQUAD = [{ n: 'kofi.testnet', relic: true }, { n: 'weaver.testnet', relic: true }, { n: 'sol:4kQ..9z', relic: false, bridge: true }, { n: 'tunde.testnet', relic: false }];
let raid = null, raidTimer = 0;
function raidReset(){ raid = { joined: false, step: 0, left: 120, done: false, fail: false, picks: [] }; }
function raidStep(){
  const s = raid.step;
  if (s === 0) return { t: 'Burn 1,000 $TOTEM at the altar', d: 'Press and hold until the altar lights up.', ui: '<button class="btn green" type="button" id="rHold" style="min-height:64px;touch-action:none">Press and hold</button>' };
  if (s === 1) return { t: 'Three must hold the relic', d: 'Pick the three squad members carrying the Red Moon relic.', ui: '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px">' + SQUAD.concat([{ n: S.account + ' (you)', relic: true, me: true }]).map((m, i) => '<button type="button" class="btn small ' + (raid.picks.includes(i) ? 'green' : 'ghost') + '" data-rp="' + i + '">' + esc(m.n) + '</button>').join('') + '</div><button class="btn" type="button" id="rConfirm" style="margin-top:10px">Confirm three</button><p class="muted" style="font-size:13px">Hint: check the squad list. Relic holders are marked.</p>' };
  if (s === 2) return { t: 'One must arrive from across the water', d: 'Who brings tokens from another chain through NEAR Intents?', ui: '<div style="display:flex;gap:8px;flex-wrap:wrap">' + SQUAD.map((m, i) => '<button type="button" class="btn small ghost" data-rb="' + i + '">' + esc(m.n) + '</button>').join('') + '</div>' };
  if (s === 3) return { t: 'Speak the phrase', d: 'I hold the meme but I am not a wallet. Sell my tokens and I lose a piece. What am I?', ui: '<div style="display:flex;gap:8px;flex-wrap:wrap">' + ['A bridge', 'A Totem', 'A treasury', 'A key'].map((a) => '<button type="button" class="btn small ghost" data-ra="' + a + '">' + a + '</button>').join('') + '</div>' };
  return { t: 'Five hands, one heartbeat', d: 'Press Sign when the black marker is inside the green zone. Everyone signs in the same block.', ui: '<div class="timing" id="rTiming"><div class="zone" style="left:44%;width:14%"></div><div class="mk" id="rMk" style="left:0"></div></div><button class="btn green" type="button" id="rSign" style="margin-top:10px">Sign</button>' };
}
let mkRaf = 0;
function paintRaid(){
  cancelAnimationFrame(mkRaf);
  const root = $('#raidRoot'); const r = raid;
  const squadHtml = '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px">' + SQUAD.map((m) => '<div class="door"><span style="font-size:14px">' + esc(m.n) + '</span>' + (m.relic ? '<span class="chip g">Relic</span>' : m.bridge ? '<span class="chip">Bridger</span>' : '') + '</div>').join('') +
    '<div class="door" style="' + (r.joined ? '' : 'border-style:dashed') + '"><span style="font-size:14px">' + (r.joined ? esc(S.account) + ' (you)' : 'Open slot') + '</span>' + (r.joined ? '<span class="chip g">Relic</span>' : '') + '</div></div>';
  let main = '';
  if (!r.joined) main = '<div class="card ink" style="display:flex;flex-direction:column;gap:12px"><h2 style="font-size:34px">Squad Kente needs a fifth</h2><p class="muted">Five onchain steps, 2 minutes. If the squad finishes, everyone gets a piece from the Totem treasury, or a Raid credential if their Totem is already full.</p><button class="btn green" type="button" id="rJoin" style="align-self:flex-start">Take the fifth slot</button></div>';
  else if (r.done) main = '<div class="card ink" style="display:flex;flex-direction:column;gap:12px"><h2 style="font-size:38px">The Red Moon Totem is awake.</h2><p>' + (r.reward || '') + '</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="button" id="rShare">Share</button><button class="btn ghost" type="button" id="rAgain">Raid again</button></div></div>';
  else if (r.fail) main = '<div class="card ink" style="display:flex;flex-direction:column;gap:12px"><h2 style="font-size:38px">The ritual faded.</h2><p class="muted">Time ran out. The squad keeps the steps learned. Try again.</p><button class="btn" type="button" id="rAgain" style="align-self:flex-start">Try again</button></div>';
  else { const st = raidStep(); main = '<div class="card ink" style="display:flex;flex-direction:column;gap:12px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><span class="chip">Step ' + (r.step + 1) + ' of 5</span><span class="chip e" id="rLeft">' + r.left + ' s left</span></div><h2 style="font-size:34px;line-height:1.1">' + st.t + '</h2><p style="color:var(--body)">' + st.d + '</p>' + st.ui + '</div>'; }
  const altars = '<div style="display:flex;gap:10px;margin:14px 0">' + [0, 1, 2, 3, 4].map((i) => '<span style="flex:1;height:14px;border-radius:999px;border:1.5px solid #000;background:' + (i < r.step || r.done ? '#00B97F' : '#fff') + '"></span>').join('') + '</div>';
  root.innerHTML = '<div class="ph"><div><span class="muted">Totem Arena, co-op</span><h1>Ritual Raid</h1></div></div>' + altars + '<div style="display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start"><div style="flex:999 1 420px;min-width:0">' + main + '</div><div style="flex:1 1 280px"><h2 style="font-size:26px;margin-bottom:10px">Squad Kente</h2>' + squadHtml + '</div></div>';
  const on = (id, ev, fn) => { const el = $('#' + id); if (el) el.addEventListener(ev, fn); };
  on('rJoin', 'click', () => { r.joined = true; r.left = 120; clearInterval(raidTimer); raidTimer = setInterval(() => { if (!r.joined || r.done || r.fail) return; r.left--; const el = $('#rLeft'); if (el) el.textContent = r.left + ' s left'; if (r.left <= 0) { r.fail = true; T.sfx('lose'); paintRaid(); } }, 1000); paintRaid(); });
  on('rAgain', 'click', () => { clearInterval(raidTimer); raidReset(); paintRaid(); });
  const next = () => { T.sfx('piece'); T.chain('Raid step ' + (r.step + 1), [{ receiver: 'arena.totemtest.testnet', method: 'raid_step', args: { squad: 'kente', step: r.step + 1 } }]); r.step++; if (r.step >= 5) win(); paintRaid(); };
  const miss = (m) => { T.sfx('lose'); r.left = Math.max(0, r.left - 10); T.toast(m + ' Ten seconds lost.'); paintRaid(); };
  const win = () => { r.done = true; clearInterval(raidTimer); if (S.pieces < 4) { S.pieces++; r.reward = 'A piece from the Totem treasury was added to Totem #0417. It now holds ' + T.fmt(S.pieces * 25000) + ' $TOTEM.'; T.log('Ritual Raid reward', '+1 piece', 'g'); } else { if (!S.prizes.includes('Raid credential')) S.prizes.push('Raid credential'); r.reward = 'Your Totem is full, so it gets the Raid credential instead.'; } T.save(); T.sfx('win'); };
  const hold = $('#rHold'); if (hold) { let ht = 0; hold.addEventListener('pointerdown', (e) => { hold.setPointerCapture(e.pointerId); hold.textContent = 'Keep holding'; ht = setTimeout(() => { ht = 0; next(); }, 1200); }); ['pointerup', 'pointercancel'].forEach((ev) => hold.addEventListener(ev, () => { if (ht) { clearTimeout(ht); ht = 0; hold.textContent = 'Press and hold'; } })); }
  $$('[data-rp]').forEach((b) => b.addEventListener('click', () => { const i = +b.dataset.rp; r.picks = r.picks.includes(i) ? r.picks.filter((x) => x !== i) : r.picks.concat(i).slice(-3); paintRaid(); }));
  on('rConfirm', 'click', () => { const ok = r.picks.length === 3 && [0, 1, 4].every((i) => r.picks.includes(i)); if (ok) next(); else { r.picks = []; miss('Those three don’t all carry the relic.'); } });
  $$('[data-rb]').forEach((b) => b.addEventListener('click', () => { if (SQUAD[+b.dataset.rb].bridge) next(); else miss('That member is already on NEAR.'); }));
  $$('[data-ra]').forEach((b) => b.addEventListener('click', () => { if (b.dataset.ra === 'A Totem') next(); else miss('The altar stays dark.'); }));
  const mk = $('#rMk'); if (mk) { const t0 = performance.now(); const loop = (now) => { const p = (Math.sin((now - t0) / 380) + 1) / 2; mk.style.left = (p * 96) + '%'; mk.dataset.p = p; mkRaf = requestAnimationFrame(loop); }; mkRaf = requestAnimationFrame(loop);
    on('rSign', 'click', () => { const p = +mk.dataset.p * 96; if (p >= 43 && p <= 57) next(); else miss('Out of sync.'); }); }
  on('rShare', 'click', () => T.share({ title: 'We woke the Red Moon Totem', stat: 'Ritual Raid cleared', line: 'Squad Kente, Totem Arena' }));
}
T.modules.raid = { enter(){ if (!gate()) return; if (!raid) raidReset(); paintRaid(); }, leave(){ cancelAnimationFrame(mkRaf); } };

/* ======================= BAGWORK ======================= */
function paintBag(){
  const b = S.bag || (S.bag = { streak: 0, today: [] });
  const tasks = [['post', 'Post about $TOTEM on X', 'Opens X with a ready post'], ['remix', 'Remix a meme in Meme Clash', 'Make or vote on a meme'], ['recruit', 'Recruit a real holder', 'Their NEAR account, checked for a real Totem']];
  const done = (k) => b.today.includes(k);
  const all = tasks.every((t) => done(t[0]));
  $('#bagRoot').innerHTML = '<div class="ph"><div><span class="muted">Totem Arena, daily</span><h1>Bagwork</h1></div><span class="chip g">Streak: ' + b.streak + ' of 14 days</span></div>' +
    '<div style="display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start"><div style="flex:999 1 420px;min-width:0;display:flex;flex-direction:column;gap:10px">' +
    tasks.map((t) => '<div class="door" style="' + (done(t[0]) ? 'background:var(--green-tint);border-color:transparent' : '') + '"><span><strong>' + t[1] + '</strong><br><span class="muted" style="font-size:13px">' + t[2] + '</span></span>' + (done(t[0]) ? '<span class="chip g">Done</span>' : t[0] === 'recruit' ? '<span style="display:flex;gap:6px"><label><span class="sr">Their account</span><input type="text" id="bagFriend" placeholder="friend.testnet" style="min-height:40px;width:140px"></label><button class="btn small" type="button" data-bag="recruit">Check</button></span>' : '<button class="btn small" type="button" data-bag="' + t[0] + '">' + (t[0] === 'post' ? 'Post' : 'Open Meme Clash') + '</button>') + '</div>').join('') +
    (all ? '<div class="card ink"><strong>Today is done.</strong> Come back tomorrow to keep the streak.</div>' : '') +
    (b.streak >= 14 ? '<div class="card ink" style="display:flex;flex-direction:column;gap:10px"><h2 style="font-size:32px">14 days. You earned a Totem shell.</h2>' + (b.claimed ? '<p class="muted">Claimed. It’s in your Profile, ready to fill.</p>' : '<button class="btn green" type="button" id="bagClaim" style="align-self:flex-start">Claim my Totem shell</button>') + '</div>' : '') +
    '<button class="btn small ghost" type="button" id="bagNext" style="align-self:flex-start">Skip to tomorrow (demo)</button></div>' +
    '<div class="card" style="flex:1 1 300px"><span class="muted">14-day streak</span><div class="cal" style="margin-top:10px">' + Array.from({ length: 14 }, (_, i) => '<span style="background:' + (i < b.streak ? '#00B97F' : '#fff') + '">' + (i + 1) + '</span>').join('') + '</div><p class="muted" style="font-size:13px;margin-top:10px">Miss a day and the streak resets. Points also count on the season leaderboard.</p></div></div>';
  $$('[data-bag]').forEach((x) => x.addEventListener('click', () => {
    const k = x.dataset.bag;
    if (k === 'post') window.open('https://x.com/intent/post?text=' + encodeURIComponent('Doing my bagwork in Totem Arena. NFTs that hold the meme, on NEAR. $TOTEM'), '_blank', 'noopener');
    if (k === 'remix') { location.hash = '#clash'; }
    if (k === 'recruit') { const v = ($('#bagFriend').value || '').trim(); if (!/^[a-z0-9._-]+\.near$/.test(v)) { T.toast('Enter their NEAR account, like friend.testnet'); return; } }
    b.today.push(k); if (tasks.every((t) => b.today.includes(t[0]))) { b.streak = Math.min(14, b.streak + 1); T.sfx('win'); T.chain('Bagwork day ' + b.streak, [{ receiver: 'arena.totemtest.testnet', method: 'record_streak', args: { day: b.streak } }]); } else T.sfx('piece');
    T.save(); if (k !== 'remix') paintBag();
  }));
  const nx = $('#bagNext'); nx.addEventListener('click', () => { if (!tasks.every((t) => b.today.includes(t[0]))) { b.streak = 0; T.toast('Streak reset. Finish all three tasks each day.'); } b.today = []; T.save(); paintBag(); });
  const cl = $('#bagClaim'); if (cl) cl.addEventListener('click', () => { b.claimed = true; S.bought.push({ id: '3' + String(Date.now()).slice(-3), pieces: 0 }); T.save(); T.chain('Claim Bagwork Totem shell', [{ receiver: 'arena.totemtest.testnet', method: 'claim_streak_reward', args: { streak: 14 } }]); T.sfx('win'); paintBag(); });
}
T.modules.bagwork = { enter(){ if (gate()) paintBag(); } };

/* ======================= FISHING PIER ======================= */
let fish = { phase: 'idle', raf: 0, p: 0, zone: [0.4, 0.55], last: null };
const CATCH = [['500 $TOTEM', 500, 'common'], ['1,500 $TOTEM', 1500, 'common'], ['3,000 $TOTEM', 3000, 'rare'], ['Harbor hat', 0, 'rare'], ['5,000 $TOTEM', 5000, 'legend']];
function today(){ return new Date().toDateString(); }
function paintFish(){
  cancelAnimationFrame(fish.raf);
