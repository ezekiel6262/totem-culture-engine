function build(){

}
function nearest(pos, from){

  return best;
}
const AI_DEF = [['kofi.testnet', 'cat', '#FFFFFF'], ['bark.testnet', '#FF5A1F', '#FF5A1F'], ['weaver.testnet', '#FFD23F', '#FFF09A'], ['sol:4kQ..9z', '#7CC6FF', '#E3F1F4'], ['tunde.testnet', '#00B97F', '#DCF6EC']];
function reset(){

  if (!getChars().some((x) => x.id === charId)) charId = 'totem';
  const c = getChars().find((x) => x.id === charId), st = stats(c);

  const p0 = P[10].clone().addScaledVector(Nn[10], -2.5); player.g.position.copy(p0); player.h = Math.atan2(Tn[10].x, Tn[10].z); scene.add(player.g);

  coins.forEach((c) => { c.taken = -1; c.m.visible = true; });
  ais.forEach((a) => placeAI(a, 0));
  if (ghost) { scene.remove(ghost.g); ghost = null; }
  if (S.ghost && S.ghost.length > 10) { const g = makeKart('#FFFFFF', 'ghost'); g.traverse((o) => { if (o.material) { o.material = o.material.clone(); o.material.transparent = true; o.material.opacity = 0.3; o.material.depthWrite = false; } }); scene.add(g); ghost = { g, path: S.ghost }; ghost.g.visible = false; }
  mode = 'count'; countEnd = performance.now() + (T.reduce ? 1000 : 3200); tStart = 0;
  $('#ghud').hidden = false; $('#minimap').hidden = false; $('#touch').hidden = false;
  paintCount();
}
function placeAI(a, dt){
  const i = Math.floor(a.u) % NS, f = a.u - Math.floor(a.u), j = (i + 1) % NS;
  const lane = a.lane + Math.sin(a.u * 0.02) * 1.6;

function progressOf(k){ return k === player ? player.lap * NS + player.idx : k.lap * NS + (k.u % NS); }
function step(dt){
  const now = performance.now();
  if (mode === 'count') { paintCount(); if (now >= countEnd) { mode = 'race'; tStart = now; $('#gOverlay').innerHTML = ''; $('#gOverlay').style.display = 'none'; } }
  const racing = mode === 'race';

  drawMini();
}
function fmtT(ms){ const s = ms / 1000; return Math.floor(s / 60) + ':' + (s % 60).toFixed(1).padStart(4, '0'); }
function drawMini(){
  const c = mm; c.clearRect(0, 0, 300, 300); c.lineWidth = 16; c.strokeStyle = '#E6E6E0'; c.beginPath();
  P.forEach((p, i) => { const q = mmScale(p); i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1]); }); c.closePath(); c.stroke();

    o.innerHTML = '<div class="card ink" style="display:flex;flex-direction:column;gap:14px">' +
      '<span class="muted">Race finished</span><h2 style="font-size:clamp(44px,8vw,72px);line-height:1">' + (first ? 'You won.' : 'You placed ' + ord(p.place) + '.') + '</h2>' +
      '<div class="grid" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div><span class="muted" style="font-size:13px">Time</span><div class="big">' + fmtT(p.ft) + '</div></div><div><span class="muted" style="font-size:13px">Place</span><div class="big">' + p.place + ' of 6</div></div><div><span class="muted" style="font-size:13px">$TOTEM collected</span><div class="big mark">' + T.fmt(p.coins) + '</div></div></div>' +
      (p.newBest ? '<div class="door"><span>Ghost saved</span><strong>Your best run, ' + fmtT(p.ft) + '. Race it next time.</strong></div>' : '') + (first ? '<div class="door" style="background:#FFFBE0;border-color:#000"><span>Prize</span><strong>A Totem with 1 piece inside</strong></div>' : '<p class="muted">Finish first to win a prize Totem. Your collected $TOTEM is still yours.</p>') +
      '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn green" type="button" id="claimRace">' + (!S.connected ? (first ? 'Claim prize, no wallet needed' : 'Keep my coins, no wallet needed') : first ? 'Claim prize and lock coins' : 'Lock coins into my Totem') + '</button><button class="btn ghost" type="button" id="shareRace">Share</button><button class="btn ghost" type="button" id="againRace">Race again</button><a class="btn ghost" href="#arena">Back to the island</a></div>' +
      '<span class="muted" style="font-size:13px">Demo. In the live game, the race server signs this result and prizes move after a 24 hour dispute window.</span></div>';
    $('#claimRace').addEventListener('click', () => {
      if (!S.connected) { S.pendingCoins = (S.pendingCoins || 0) + p.coins; S.pendingPrize = first || S.pendingPrize; S.races++; T.save(); location.hash = '#claim'; return; }
      S.wallet += p.coins; T.log('Meme Kart, ' + ord(p.place) + ' place', '+' + T.fmt(p.coins) + ' $TOTEM', 'g');
      if (first) { S.prizes.push('Prize Totem #P' + (100 + S.prizes.length)); T.log('Won a prize Totem', '1 piece', 'g'); }
      S.races++; T.save(); T.toast(first ? 'Prize Totem claimed. Coins are in your wallet, ready to lock.' : 'Coins are in your wallet, ready to lock.'); location.hash = '#lock';
    });
    $('#againRace').addEventListener('click', () => reset());
    $('#shareRace').addEventListener('click', () => T.share({ title: first ? 'I won Meme Kart' : 'I placed ' + ord(p.place) + ' in Meme Kart', stat: fmtT(p.ft) + ', ' + T.fmt(p.coins) + ' $TOTEM', line: 'Totem Arena on NEAR' }));
  }, 900);
}
function ord(n){ return n + (n === 1 ? 'st' : n === 2 ? 'nd' : n === 3 ? 'rd' : 'th'); }
function select(){
  mode = 'select'; $('#ghud').hidden = true; $('#minimap').hidden = true; $('#touch').hidden = true;
  const o = $('#gOverlay'); o.style.display = 'flex'; o.style.background = ''; o.style.backdropFilter = '';
  const portrait = (c) => c.kind === 'rented' ? T.svgTotem(S.rented.pieces, 54, 'wings') : c.kind === 'totem' ? T.svgTotem(S.pieces, 54, 'wings') : c.kind === 'cat'
    ? '<svg width="54" height="73" viewBox="0 0 60 80" aria-hidden="true"><path d="M10 26 L16 8 L26 22 M50 26 L44 8 L34 22" fill="#000" stroke="#000" stroke-width="2"/><rect x="8" y="22" width="44" height="40" rx="8" fill="#000"/><circle cx="22" cy="40" r="4" fill="#FFF09A"/><circle cx="38" cy="40" r="4" fill="#FFF09A"/></svg>'
    : '<svg width="54" height="73" viewBox="0 0 60 80" aria-hidden="true"><path d="M30 10 L52 40 L30 70 L8 40 Z" fill="#FF5A1F" stroke="#000" stroke-width="2.5"/></svg>';
  o.innerHTML = '<div class="card ink" style="display:flex;flex-direction:column;gap:16px">' +
    '<div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:end"><h2 style="font-size:clamp(44px,8vw,68px);line-height:1">Meme Kart</h2><span class="chip g">Prize: a Totem with 25,000 $TOTEM</span></div>' +
    '<p style="color:#34342F">Pick your driver. Three laps, five rivals, coins on the track. Win and the prize Totem lands in your account.</p>' +
    (S.ghostT ? '<div class="door" style="background:#F6F6F2;border-color:#F6F6F2"><span>Ghost to beat</span><strong>Your best, ' + fmtT(S.ghostT) + '</strong></div>' : '') + '<div class="chars">' + getChars().map((c) => { const s = stats(c); return '<button type="button" class="charbtn" data-c="' + c.id + '" aria-pressed="' + (c.id === charId) + '"><div style="display:flex;gap:12px;align-items:center">' + portrait(c) + '<span><span style="font-family:var(--serif);font-size:24px;line-height:1">' + c.name + '</span><br><span style="font-size:13px;opacity:.75">' + c.sub + '</span></span></div>' +
      '<div class="stat"><span>Speed</span><i style="--v:' + Math.round(s.speed * 100) + '%"></i></div><div class="stat"><span>Accel</span><i style="--v:' + Math.round(s.accel * 100) + '%"></i></div><div class="stat"><span>Handling</span><i style="--v:' + Math.round(s.handling * 100) + '%"></i></div></button>'; }).join('') + '</div>' + (S.rented ? '' : '<a href="#rent" style="font-size:14px">Rent a full Totem to race with more speed</a>') +
    '<p class="muted" style="font-size:14px" id="charNote">' + (getChars().find((c) => c.id === charId) || chars[0]).note + '</p>' +
    '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="btn green" type="button" id="startRace">Start race</button><span class="muted" style="font-size:14px">' + (T.isTouch ? 'Use the buttons on screen. Hold Drift while turning, let go for a boost.' : 'Arrows or WASD to drive. Hold Space while turning to drift, let go for a boost.') + '</span></div></div>';
  $$('.charbtn', o).forEach((b) => b.addEventListener('click', () => { charId = b.dataset.c; select(); }));
  $('#startRace').addEventListener('click', () => { if (!built) { T.toast('3D is not available in this browser'); return; } reset(); });
}
function loop(now){
  if (!running) return; raf = requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - (last || now)) / 1000); last = now;
  T.fitRenderer(R, cam, $('#game'));
  if (mode === 'select') { const a = now / 6000; cam.position.set(Math.cos(a) * 70 + 15, 38, Math.sin(a) * 70 + 45); cam.lookAt(15, 0, 45); }
  else step(dt);
  R.render(scene, cam);
}
const keyMap = { ArrowUp: 'gas', KeyW: 'gas', ArrowDown: 'brake', KeyS: 'brake', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', Space: 'drift' };
function kd(e){ if (!running) return; const k = keyMap[e.code]; if (!k) return; if (mode === 'race' || mode === 'count') e.preventDefault(); keys[k] = true; }
function ku(e){ const k = keyMap[e.code]; if (k) keys[k] = false; }
window.addEventListener('keydown', kd); window.addEventListener('keyup', ku);
$$('#touch button').forEach((b) => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', (e) => { e.preventDefault(); keys[k] = true; b.setPointerCapture(e.pointerId); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach((ev) => b.addEventListener(ev, () => { keys[k] = false; }));
});
$('#quitRace').addEventListener('click', () => select());
T.modules.play = {
  enter(){ if (!T.requireArena()) return; if (!built) build(); keys = {}; select(); if (R) { running = true; last = 0; raf = requestAnimationFrame(loop); } },
  leave(){ running = false; cancelAnimationFrame(raf); keys = {}; }
};
})();
</script>
