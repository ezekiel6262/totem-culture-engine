<script>
/* ======================= WALLET AND WRITES ========================
   Real NEAR sign-in, and the writes that need it. Everything here is additive and gated
   on a signed session: with no wallet connected the screens behave exactly as the demo
   always has. The wallet bundle is only fetched when someone asks to connect. */
(function(){
'use strict';
const T = window.TOTEM; const { $, $$, S } = T;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const section = (route) => document.querySelector('[data-route="' + route + '"]');
const append = (route, id, html) => {
  const page = section(route);
  if (!page) return null;
  const existing = page.querySelector('#' + id);
  if (existing) existing.remove();
  const box = document.createElement('div');
  box.id = id;
  box.style.marginTop = '22px';
  box.innerHTML = html;
  page.appendChild(box);
  return box;
};

/* ---------- lazy loading of the wallet bundle ---------- */
let loading = null;
function loadScript(src){
  return new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = src; el.onload = resolve; el.onerror = () => reject(new Error('Could not load ' + src));
    document.head.appendChild(el);
  });
}
async function loadWallet(){
  if (!loading) loading = (async () => {
    if (!document.querySelector('link[data-wallet-css]')) {
      const link = document.createElement('link');
      link.rel = 'stylesheet'; link.href = 'wallet.css'; link.dataset.walletCss = '';
      document.head.appendChild(link);
    }
    if (!window.totemApi) await loadScript('totem-api.js');
    if (!window.totemWallet) await import('./wallet.js');
    const health = await T.api.get('/health');
    return { network: (health.ok && health.data.network) || 'testnet', contractId: 'nft.totemtest.testnet' };
  })().catch((error) => { loading = null; throw error; });
  return loading;
}

/* ---------- session ---------- */
const session = () => (window.totemApi && window.totemApi.session) || null;
const signedInAs = () => { const s = session(); return s && s.identity ? s.identity.accountId : null; };
const authed = (path, options) => window.totemApi.request(path, Object.assign({ authenticated: true }, options || {}));

T.wallet = {
  account: signedInAs,
  async connect(){
    const options = await loadWallet();
    const identity = await window.totemWallet.connect(options);
    return identity ? identity.accountId : null;
  },
  async signOut(){
    if (!window.totemWallet) return;
    await window.totemWallet.signOut(await loadWallet());
  },
  // Sent from the holder's own wallet. Totem holds no key that could do this for them.
  async signAndSendTransaction(transaction){
    const options = await loadWallet();
    return window.totemWallet.signAndSendTransaction(transaction, options);
  }
};

/* ---------- profile: sign in, and the Totems the server holds for you ---------- */
async function paintWallet(){
  if (!T.api.live) return;
  const account = signedInAs();
  const head = '<h2 style="font-size:32px;margin:0 0 12px">NEAR wallet ' + (account ? '<span class="chip g">Signed in</span>' : '<span class="chip">Not signed in</span>') + '</h2>';

  if (!account) {
    const box = append('profile', 'walletBox', head +
      '<div class="card" style="display:flex;flex-direction:column;gap:12px;max-width:720px">' +
      '<p style="margin:0">Sign in with a NEAR wallet to use the live Totem API. Signing is a gas free NEP-413 message, not a transaction, and it proves the account is yours.</p>' +
      '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn green" type="button" id="walletConnect">Connect NEAR wallet</button></div>' +
      '<p class="muted" style="font-size:13px;margin:0">Your holdings, the Arenas you can enter and anything you operate are read from NEAR once you sign in.</p></div>');
    if (!box) return;
    $('#walletConnect').addEventListener('click', async (event) => {
      const button = event.currentTarget;
      button.textContent = 'Opening wallet...'; button.setAttribute('aria-disabled', 'true');
      try {
        const connected = await T.wallet.connect();
        if (!connected) { T.toast('Wallet was not connected'); paintWallet(); return; }
        T.toast('Signed in as ' + connected);
        document.dispatchEvent(new CustomEvent('totem:session', { detail: { accountId: connected } }));
        paintWallet();
      } catch (error) {
        T.toast(error && error.message ? error.message : 'Could not connect the wallet');
        paintWallet();
      }
    });
    return;
  }

  const owned = await T.api.get('/totems?owner=' + encodeURIComponent(account));
  const totems = owned.ok ? owned.data.totems : [];
  // The account endpoint reads NEP-141 and NEP-171 state directly, so this is what the
  // chain says about this wallet rather than what this platform remembers about it.
  const live = await T.api.get('/accounts/' + encodeURIComponent(account));
  const chain = live.ok ? live.data.onChain : null;
  const operates = Boolean(live.ok && live.data.operator);
  T.holdings = chain && chain.source === 'chain' ? Object.assign({ accountId: account, operator: operates }, chain) : null;
  // Only an operator needs the Arena's settings, so only an operator fetches them.
  const arenaResponse = operates ? await T.api.get('/arenas/totem') : null;
  const arena = arenaResponse && arenaResponse.ok ? arenaResponse.data.arena : null;
  const ledger = await T.api.get('/accounts/' + encodeURIComponent(account) + '/ledger?limit=6');
  const rows = ledger.ok ? ledger.data.ledger : [];

  const cards = totems.length
    ? totems.map((totem) => '<div class="card" style="display:flex;flex-direction:column;gap:10px">' +
        '<div style="display:flex;gap:14px;align-items:center">' + T.svgTotem(totem.pieces, 56) +
        '<div><a href="#nft-' + esc(totem.id) + '" style="font-family:var(--serif);font-size:28px;line-height:1;text-decoration:none">Totem #' + esc(totem.id) + '</a><br>' +
        '<span class="muted" style="font-size:13px">' + T.fmt(totem.holds) + ' $TOTEM inside</span></div></div>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn small" type="button" data-lock="' + esc(totem.id) + '"' + (totem.pieces >= 4 ? ' aria-disabled="true"' : '') + '>Lock a piece</button>' +
        '<button class="btn small ghost" type="button" data-unlock="' + esc(totem.id) + '"' + (totem.pieces < 1 ? ' aria-disabled="true"' : '') + '>Take one out</button></div></div>').join('')
    : '<div class="card"><p style="margin:0">This account holds no Totem on the server yet.</p></div>';

  // An unreachable RPC and a zero balance are different facts, so they are shown
  // differently. Nothing here is rendered from a stored number.
  const onChainCard = !chain || chain.source !== 'chain'
    ? '<div class="card"><span class="chip">On chain</span><p class="muted" style="margin:10px 0 0">Could not reach NEAR just now, so holdings are not shown. Nothing is guessed here.</p></div>'
    : '<div class="card" style="display:flex;flex-direction:column;gap:12px">' +
      '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="chip g">On chain</span>' +
      (operates ? '<span class="chip">Arena operator</span>' : '') +
      '<span class="muted" style="font-size:12px">read at block ' + esc(String(chain.blockHeight)) + '</span></div>' +
      '<div style="display:flex;gap:28px;flex-wrap:wrap">' +
      '<div><div style="font-family:var(--serif);font-size:30px;line-height:1">' + T.fmt(Number(chain.balanceWhole)) + '</div><span class="muted" style="font-size:13px">$TOTEM held</span></div>' +
      '<div><div style="font-family:var(--serif);font-size:30px;line-height:1">' + esc(String(chain.pieces)) + ' of 4</div><span class="muted" style="font-size:13px">pieces this buys</span></div>' +
      '<div><div style="font-family:var(--serif);font-size:30px;line-height:1">' + (chain.totemTokenId ? '#' + esc(chain.totemTokenId) : 'none') + '</div><span class="muted" style="font-size:13px">Totem owned</span></div>' +
      '</div>' +
      '<span class="muted" style="font-family:var(--mono);font-size:12px;word-break:break-all">' + esc(chain.tokenContractId) + '</span>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="btn small green" type="button" id="claimTokens">Claim 25,000 $TOTEM</button>' +
      (chain.totemTokenId ? '' : '<button class="btn small" type="button" id="claimPermit">Claim a mint permit</button><button class="btn small ghost" type="button" id="mintTotem">Mint my Totem</button>') +
      '</div>' +
      '<span class="muted" style="font-size:12px">The faucet sends one piece, which is the smallest amount a one piece Arena accepts. The permit is signed by Totem; the mint is signed by you.</span>' +
      '</div>';

  // The operator console. It appears only for the account the Arena actually names as its
  // operator, and every control writes through an endpoint that checks that again on the
  // server. Hiding it is presentation; the authorisation is the server's.
  const operatorCard = !operates || !arena ? '' :
    '<div class="card ink" style="display:flex;flex-direction:column;gap:14px;margin-top:14px">' +
    '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="chip e">Operator</span>' +
    '<h3 style="font-size:26px;margin:0">' + esc(arena.name) + '</h3>' +
    '<span class="chip' + (arena.paused ? '' : ' g') + '">' + (arena.paused ? 'Paused' : 'Live') + '</span></div>' +
    '<p class="muted" style="margin:0;font-size:14px">You run this Arena. Entry is checked against $TOTEM held on chain, and prizes are paid from the Arena prize account.</p>' +
    '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px">' +
    '<label style="display:flex;flex-direction:column;gap:6px"><span class="muted" style="font-size:13px">Entry, in pieces</span><input id="opEntry" type="number" min="0" max="4" step="1" value="' + esc(String(arena.entryPieces ?? 1)) + '" style="padding:10px;border:1.5px solid var(--line);border-radius:10px;font:inherit"></label>' +
    '<label style="display:flex;flex-direction:column;gap:6px"><span class="muted" style="font-size:13px">Prize for a win</span><input id="opFirst" type="number" min="0" max="100000" step="500" value="' + esc(String(arena.prizeFirst ?? 5000)) + '" style="padding:10px;border:1.5px solid var(--line);border-radius:10px;font:inherit"></label>' +
    '<label style="display:flex;flex-direction:column;gap:6px"><span class="muted" style="font-size:13px">Prize for a place</span><input id="opOther" type="number" min="0" max="100000" step="250" value="' + esc(String(arena.prizeOther ?? 1000)) + '" style="padding:10px;border:1.5px solid var(--line);border-radius:10px;font:inherit"></label>' +
    '</div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
    '<button class="btn small green" type="button" id="opSave">Save settings</button>' +
    '<button class="btn small" type="button" id="opPause">' + (arena.paused ? 'Reopen the Arena' : 'Pause the Arena') + '</button>' +
    '<button class="btn small ghost" type="button" id="opSettle">Settle results past the dispute window</button>' +
    '</div>' +
    '<span class="muted" style="font-size:12px">A prize is capped at 100,000 $TOTEM, one full Totem. Set a prize to 0 to stop paying for that placing.</span>' +
    '</div>';

  const activity = rows.length
    ? '<div class="card" style="margin-top:14px"><span class="muted" style="font-size:13px">Activity on the server</span>' +
      rows.map((row) => '<div style="display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:8px;margin-top:8px"><span>' + esc(row.title) + '</span><strong style="color:' + (row.tone === 'e' ? 'var(--ember-ink)' : 'var(--green-ink)') + '">' + esc(row.amount) + '</strong></div>').join('') + '</div>'
    : '';

  const box = append('profile', 'walletBox', head +
    '<div class="card" style="display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:14px">' +
    '<span style="font-family:var(--mono)">' + esc(account) + '</span>' +
    '<button class="btn ghost small" type="button" id="walletOut">Sign out</button></div>' +
    onChainCard + operatorCard +
    '<div class="grid g3" style="margin-top:14px">' + cards + '</div>' + activity);
  if (!box) return;

  $('#walletOut').addEventListener('click', async () => {
    await T.wallet.signOut();
    T.toast('Signed out');
    document.dispatchEvent(new CustomEvent('totem:session', { detail: { accountId: null } }));
    paintWallet();
  });

  const write = async (button, run, done) => {
    if (button.getAttribute('aria-disabled') === 'true') return;
    button.setAttribute('aria-disabled', 'true');
    try {
      const result = await run();
      T.toast(done(result));
      if (result.calls) T.chain('On the server', result.calls, true);
      paintWallet();
    } catch (error) {
      T.toast(error && error.message ? error.message : 'That did not work');
      paintWallet();
    }
  };

  const opSave = $('#opSave');
  if (opSave) opSave.addEventListener('click', () => write(opSave,
    () => authed('/api/v1/arenas/totem/settings', { method: 'POST', body: JSON.stringify({
      entryPieces: Number($('#opEntry').value),
      prizeFirst: Number($('#opFirst').value),
      prizeOther: Number($('#opOther').value)
    }) }),
    (result) => 'Saved. Entry ' + result.arena.entryPieces + ' piece(s), prizes ' + T.fmt(result.arena.prizeFirst) + ' and ' + T.fmt(result.arena.prizeOther) + ' $TOTEM.'));

  const opPause = $('#opPause');
  if (opPause) opPause.addEventListener('click', () => write(opPause,
    () => authed('/api/v1/arenas/totem/pause', { method: 'POST', body: JSON.stringify({ paused: !arena.paused }) }),
    (result) => result.arena.paused ? 'The Arena is paused. Nobody can enter.' : 'The Arena is open.'));

  const opSettle = $('#opSettle');
  if (opSettle) opSettle.addEventListener('click', () => write(opSettle,
    () => authed('/api/v1/arenas/totem/settle', { method: 'POST', body: JSON.stringify({ game: 'meme-kart' }) }),
    (result) => result.settled.length + ' result(s) settled, ' + result.pending + ' still inside the dispute window.'));

  const claimTokens = $('#claimTokens');
  if (claimTokens) claimTokens.addEventListener('click', () => write(claimTokens,
    () => authed('/api/v1/claims/tokens', { method: 'POST', body: JSON.stringify({}) }),
    (result) => result.alreadyGranted
      ? 'This account already claimed from the faucet.'
      : 'Sent ' + T.fmt(result.whole) + ' $TOTEM. Transaction ' + result.transactionHash));

  const claimPermit = $('#claimPermit');
  if (claimPermit) claimPermit.addEventListener('click', () => write(claimPermit,
    () => authed('/api/v1/claims/eligibility', { method: 'POST', body: JSON.stringify({}) }),
    (result) => result.alreadyGranted
      ? 'This account already has a mint permit. Press Mint my Totem.'
      : 'Permit ' + result.number + ' of 1000 granted. ' + result.remaining + ' left. Now press Mint my Totem.'));

  // The mint is sent from the holder's own wallet. Totem has no key that can mint for them,
  // which is the point: the Totem that appears is the result of their signature.
  const mintTotem = $('#mintTotem');
  if (mintTotem) mintTotem.addEventListener('click', async () => {
    if (mintTotem.getAttribute('aria-disabled') === 'true') return;
    mintTotem.setAttribute('aria-disabled', 'true');
    try {
      const outcome = await T.wallet.signAndSendTransaction({
        receiverId: chain.nftContractId,
        actions: [{ type: 'FunctionCall', params: { methodName: 'mint', args: {}, gas: '60000000000000', deposit: '100000000000000000000000' } }]
      });
      T.toast('Minted. ' + (outcome && outcome.transaction ? outcome.transaction.hash : 'Check your wallet.'));
    } catch (error) {
      T.toast(error && error.message ? error.message : 'The mint was not sent');
    }
    paintWallet();
  });

  $$('[data-lock]').forEach((button) => button.addEventListener('click', () => write(button,
    () => authed('/api/v1/totems/' + encodeURIComponent(button.dataset.lock) + '/pieces', { method: 'POST' }),
    (result) => 'Locked a piece. Totem #' + result.totem.id + ' now holds ' + T.fmt(result.totem.holds) + ' $TOTEM.')));

  $$('[data-unlock]').forEach((button) => button.addEventListener('click', () => write(button,
    () => authed('/api/v1/totems/' + encodeURIComponent(button.dataset.unlock) + '/pieces', { method: 'DELETE' }),
    (result) => 'Took a piece out. Totem #' + result.totem.id + ' now holds ' + T.fmt(result.totem.holds) + ' $TOTEM.')));
}

const baseProfile = T.modules.profile;
T.modules.profile = { enter(){ baseProfile.enter(); paintWallet(); } };

/* Restore a session saved earlier in this tab, so a reload keeps you signed in. */
window.addEventListener('DOMContentLoaded', () => {
  (async () => {
    if (!(await T.api.ready)) return;
    try {
      if (!window.totemApi) await loadScript('totem-api.js');
      if (!window.totemApi.session) return;
      const restored = await window.totemApi.restore();
      if (!restored) return;
      document.dispatchEvent(new CustomEvent('totem:session', { detail: { accountId: restored.accountId } }));
      const current = (location.hash || '#home').slice(1).split('-')[0];
      if (T.modules[current]) T.modules[current].enter();
    } catch (error) { /* a stale session is cleared by restore itself */ }
  })();
});
})();
</script>
