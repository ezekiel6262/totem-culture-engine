[workspace]
members = ["totem-token", "totem-nft", "totem-factory", "totem-agent", "totem-market"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
near-sdk = "=5.30.1"
near-contract-standards = "=5.30.1"
serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
