AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Totem culture engine API
Parameters:
  AuthRecipient: {Type: String}
  NearRpcUrl: {Type: String, Default: 'https://rpc.testnet.near.org'}
  NearNetwork: {Type: String, Default: testnet, AllowedValues: [testnet, mainnet]}
  TotemTokenContractId: {Type: String, Default: token.totem.testnet}
  TotemNftContractId: {Type: String, Default: nft.totem.testnet}
  ArenaAgentContractId: {Type: String, Default: agent.totem.testnet}
  ArenaMarketContractId: {Type: String, Default: market.totem.testnet}
  MainnetLaunchEnabled: {Type: String, Default: 'false', AllowedValues: ['true', 'false']}
  MainnetParentAccount: {Type: String, Default: maleegg7870.near}
  ContractsAudited: {Type: String, Default: 'false', AllowedValues: ['true', 'false']}
  CustomDomainName: {Type: String, Default: ''}
  CustomDomainCertificateArn: {Type: String, Default: ''}
  TokenArtifactSha256: {Type: String, Default: 2A1E7AA0902619272226ACDEFB06D51FD3BDF0196FBCC94C3F45CA9FFCECED9E}
  NftArtifactSha256: {Type: String, Default: 9FBB3EF2F7E4E3682784035A466FF02CAAF766526516A6F4386DC72039587929}
Conditions:
  UseCustomDomain: !Not [!Equals [!Ref CustomDomainName, '']]
Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 20
    Tracing: Active
    Environment:
      Variables:
        NODE_ENV: production
        TOTEM_DYNAMODB_TABLE: !Ref TotemTable
        TOTEM_AUTH_RECIPIENT: !Ref AuthRecipient
        NEAR_RPC_URL: !Ref NearRpcUrl
        NEAR_NETWORK: !Ref NearNetwork
        TOTEM_TOKEN_CONTRACT_ID: !Ref TotemTokenContractId
        TOTEM_NFT_CONTRACT_ID: !Ref TotemNftContractId
        TOTEM_ARENA_AGENT_CONTRACT_ID: !Ref ArenaAgentContractId
        TOTEM_ARENA_MARKET_CONTRACT_ID: !Ref ArenaMarketContractId
        TOTEM_MAINNET_LAUNCH_ENABLED: !Ref MainnetLaunchEnabled
        TOTEM_MAINNET_PARENT_ACCOUNT: !Ref MainnetParentAccount
        TOTEM_CONTRACTS_AUDITED: !Ref ContractsAudited
        TOTEM_TOKEN_ARTIFACT_SHA256: !Ref TokenArtifactSha256
        TOTEM_NFT_ARTIFACT_SHA256: !Ref NftArtifactSha256
        TOTEM_SEED_DEMO: 'false'
Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: {Status: Enabled}
  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-frontend-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  ApiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-api-no-cache'
        DefaultTTL: 0
        MaxTTL: 1
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig: {CookieBehavior: none}
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          HeadersConfig: {HeaderBehavior: none}
          QueryStringsConfig: {QueryStringBehavior: all}
  ApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub '${AWS::StackName}-api-forward'
        CookiesConfig: {CookieBehavior: none}
        HeadersConfig:
          HeaderBehavior: whitelist
          # CloudFront-Viewer-Address is the authoritative client address for the rate
          # limits on the public claim endpoint. Until this reaches the stack the API
          # falls back to the first X-Forwarded-For entry, which CloudFront sets and the
          # viewer cannot forge, because the viewer's own copy is not forwarded.
          Headers: [Accept, Authorization, Content-Type, Origin, CloudFront-Viewer-Address]
        QueryStringsConfig: {QueryStringBehavior: all}
  TotemTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}
  TotemApi:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda.handler
      CodeUri: ../backend
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref TotemTable}
      Events:
        Root: {Type: HttpApi, Properties: {Path: /api, Method: ANY}}
        Proxy: {Type: HttpApi, Properties: {Path: '/api/{proxy+}', Method: ANY}}
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [lambda.js]
        Format: cjs
        Target: es2022
        Minify: true
        Sourcemap: false
  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    DependsOn: ServerlessHttpApiApiGatewayDefaultStage
    Properties:
      DistributionConfig:
        Aliases: !If
          - UseCustomDomain
          - [!Ref CustomDomainName, !Sub 'www.${CustomDomainName}']
          - !Ref AWS::NoValue
        Comment: Totem live product
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        ViewerCertificate: !If
          - UseCustomDomain
          - AcmCertificateArn: !Ref CustomDomainCertificateArn
            MinimumProtocolVersion: TLSv1.2_2021
            SslSupportMethod: sni-only
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref FrontendOriginAccessControl
            S3OriginConfig: {OriginAccessIdentity: ''}
          - Id: api
            DomainName: !Sub '${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: frontend
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CacheBehaviors:
          - PathPattern: '/api*'
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            Compress: true
            AllowedMethods: [DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT]
            CachedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref ApiCachePolicy
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'
Outputs:
  ApiUrl:
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  TableName:
    Value: !Ref TotemTable
  FrontendBucketName:
    Value: !Ref FrontendBucket
  FrontendUrl:
    Value: !Sub 'https://${FrontendDistribution.DomainName}'
  FrontendDistributionId:
    Value: !Ref FrontendDistribution
