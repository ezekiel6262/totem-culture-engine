<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOTEM | Culture Engine on NEAR</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml"><script src="./support.js"></script><link rel="stylesheet" href="./wallet.css"><link rel="stylesheet" href="./platform.css">
</head><body><x-dc><helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body{margin:0;background:#0D0D0B;color:#EDE6D8;font-family:'Geist',sans-serif;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}a{color:#00E89A;text-decoration:none}button{font:inherit}</style></helmet>
<div style="min-height:100vh;background:#0D0D0B;color:#EDE6D8"><div style="display:flex;align-items:center;justify-content:space-between;padding:18px 40px;border-bottom:1px solid #24241F;gap:20px;flex-wrap:wrap"><div style="display:flex;align-items:center;gap:14px"><a href="Landing.dc.html" style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;color:#EDE6D8">TOTEM</a><span style="font-family:'JetBrains Mono',monospace;font-size:14px;color:#00E89A">/ FORGE</span></div><span style="font-family:'JetBrains Mono',monospace;font-size:14px;color:#A8A397">Choose an origin · step 1</span><a href="{{ nextHref }}" onClick="{{ save }}" style="padding:14px 22px;background:#00E89A;border-radius:10px;color:#0D0D0B;font-weight:600;font-size:17px">{{ nextLabel }}</a></div>
<main style="max-width:1400px;margin:0 auto;padding:56px 40px 90px"><div style="font-family:'JetBrains Mono',monospace;font-size:14px;color:#00E89A;letter-spacing:.06em">ONE CULTURE · THREE LAUNCH PATHS</div><h1 style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(44px,5vw,68px);letter-spacing:-.045em;margin:12px 0 14px">What are you launching?</h1><p style="font-size:19px;line-height:1.55;color:#C9C3B6;max-width:820px;margin:0 0 36px">Choose a Token, NFT, or Twin launch. Forge collects only the parameters that path needs, then applies the shared Culture DNA.</p>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px"><sc-for list="{{ origins }}" as="o" hint-placeholder-count="4"><button onClick="{{ o.pick }}" style="{{ o.style }}"><div style="font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.05em">{{ o.flow }}</div><div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:31px;letter-spacing:-.02em;margin:18px 0 12px">{{ o.title }}</div><div style="font-size:16px;line-height:1.55">{{ o.desc }}</div><div style="font-family:'JetBrains Mono',monospace;font-size:13px;margin-top:24px;opacity:.7">{{ o.collects }}</div></button></sc-for></div>
<div style="margin-top:22px;padding:22px 26px;border:1px solid #26261F;border-radius:16px;background:#141410;color:#C9C3B6"><b style="color:#EDE6D8">{{ selectedTitle }}</b> · {{ selectedSummary }}</div></main></div></x-dc>
<script type="text/x-dc" data-dc-script>class Component extends DCLogic{state={origin:'token'};renderVals(){const O=[['token','TOKEN','Token','Launch a fungible community token and define how its NFT culture can grow around it.','TOKEN ECONOMICS · DISTRIBUTION · LAUNCH','Token-First.dc.html','Configure token'],['nft','NFT','NFT','Launch a native NFT collection and define the token economy it can connect to.','COLLECTION · MINT · ROYALTIES · RIGHTS','NFT-First.dc.html','Configure NFT'],['twin','TOKEN + NFT','Twin','Launch the token and NFT collection together as one Culture Pair.','TOKEN + COLLECTION + GENESIS LINK','Twin-Launch.dc.html','Configure both']];const cur=O.find(x=>x[0]===this.state.origin);return{nextHref:cur[5],nextLabel:cur[6],selectedTitle:cur[2],selectedSummary:cur[3],save:()=>sessionStorage.setItem('totem.forge.v1',JSON.stringify({origin:this.state.origin})),origins:O.map(([id,flow,title,desc,collects])=>{const on=id===this.state.origin;return{flow,title,desc,collects,pick:()=>this.setState({origin:id}),style:{textAlign:'left',cursor:'pointer',padding:'30px 28px',borderRadius:18,background:on?'#EDE6D8':'#141410',color:on?'#0D0D0B':'#EDE6D8',border:on?'3px solid #00E89A':'2px solid #26261F',minHeight:300}}})}}}</script><script src="./totem-api.js"></script><script type="module" src="./wallet.js"></script></body></html>
