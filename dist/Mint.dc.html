<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body{margin:0;background:#070706;color:#EDE6D8;font-family:'Geist',sans-serif;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}a{color:#00E89A;text-decoration:none}a:hover{color:#EDE6D8}button{font:inherit}</style>
</helmet>
<div data-screen-label="04 Holder mint and evolve" style="min-height:100vh;display:flex;justify-content:center;padding:32px 16px">
  <div style="width:390px;max-width:100%;min-height:844px;background:#0D0D0B;border:1px solid #26261F;border-radius:36px;padding:20px;display:flex;flex-direction:column">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <a href="Community.dc.html" style="width:46px;height:46px;border:1px solid #33332C;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#EDE6D8;font-size:20px">‹</a>
      <span style="font-family:'JetBrains Mono',monospace;font-size:13px;color:#C9C3B6">bbc.totem.near</span>
      <button onClick="{{ reset }}" style="height:46px;padding:0 14px;border:1px solid #33332C;border-radius:12px;background:transparent;color:#C9C3B6;font-family:'JetBrains Mono',monospace;font-size:13px;cursor:pointer" style-hover="border-color:#EDE6D8">Reset</button>
    </div>
    <div style="{{ kickerS }}">{{ kicker }}</div>
    <h1 style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:31px;line-height:1.05;letter-spacing:-0.03em;margin:8px 0 18px">{{ title }}</h1>
    <div style="background:#141410;border:1px solid #26261F;border-radius:20px;height:270px;display:flex;align-items:center;justify-content:center;flex-shrink:0">
      <dc-import name="Totem" size="130" crown="{{ crown }}" head="{{ head }}" eye="{{ eye }}" wings="{{ wings }}" body="#EDE6D8" body-h="0.65" hint-size="130px,200px"></dc-import>
    </div>
    <sc-if value="{{ isChoose }}" hint-placeholder-val="{{ false }}">
      <div style="font-size:14px;color:#C9C3B6;margin:14px 0 10px;line-height:1.45">Behavior read: 3 raids won, streak 34d, 0 referrals. Pick from the branches you earned.</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <sc-for list="{{ branches }}" as="b" hint-placeholder-count="2">
          <button onClick="{{ b.pick }}" style="{{ b.style }}"><span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:18px">{{ b.name }}</span><span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#A8A397">{{ b.why }}</span></button>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ notChoose }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:14px">
        <sc-for list="{{ rows }}" as="r" hint-placeholder-count="3">
          <div style="display:flex;align-items:center;gap:14px;padding:12px 14px;background:#141410;border:1px solid #26261F;border-radius:12px">
            <div style="{{ r.dotS }}">{{ r.mark }}</div>
            <div><div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:16px">{{ r.t }}</div><div style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#A8A397;margin-top:2px">{{ r.s }}</div></div>
          </div>
        </sc-for>
      </div>
    </sc-if>
    <div style="flex:1;min-height:20px"></div>
    <sc-if value="{{ hasCta }}" hint-placeholder-val="{{ true }}">
      <button onClick="{{ act }}" style="width:100%;padding:18px;background:#00E89A;color:#0D0D0B;border:none;border-radius:14px;font-weight:600;font-size:18px;cursor:pointer" style-hover="background:#4DF2BA">{{ cta }}</button>
    </sc-if>
    <sc-if value="{{ isDone }}" hint-placeholder-val="{{ false }}">
      <a href="Arena.dc.html" style="display:block;text-align:center;padding:18px;background:#00E89A;color:#0D0D0B;border-radius:14px;font-weight:600;font-size:18px" style-hover="background:#4DF2BA;color:#0D0D0B">Enter the Arena</a>
    </sc-if>
    <div style="text-align:center;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#A8A397;margin-top:12px">Eligibility proof checked onchain · gas on NEAR</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;startStage&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;quest&quot;,&quot;ready&quot;,&quot;minted&quot;,&quot;choose&quot;,&quot;evolved&quot;],&quot;default&quot;:&quot;quest&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { stage: this.props.startStage ?? 'quest', branch: null };
  renderVals() {
    const { stage, branch } = this.state, set = o => this.setState(o);
    const G = '#00E89A', O = '#FF6B3D';
    const bc = branch === 'diamond' ? G : O, bname = branch === 'diamond' ? 'Diamond Holder' : 'Meme Commander';
    const done = (t, s) => ({ t, s, mark: '✓', dotS: { width: 32, height: 32, borderRadius: '50%', background: G, color: '#0D0D0B', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, fontWeight: 700 } });
    const open = (t, s) => ({ t, s, mark: '·', dotS: { width: 32, height: 32, borderRadius: '50%', background: '#5A5A50', color: '#0D0D0B', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 } });
    const base = [done('Hold 100,000 BBC', '184,220 BBC · bought via Intents'), done('Hold streak 30 days', '30 / 30 days · no dips')];
    const M = {
      quest: { k: 'ALMOST ELIGIBLE', title: 'One quest from your first segment', rows: [...base, open('Complete 1 quest', 'Meme raid on $DOGGO · open')], cta: 'Complete quest: Meme raid', next: 'ready', head: 'ghost', crown: 'none' },
      ready: { k: 'ELIGIBLE', title: 'Your Recruit is ready to carve', rows: [...base, done('Complete 1 quest', 'Meme raid on $DOGGO · won')], cta: 'Mint BBC Recruit', next: 'minted', head: 'ghost', crown: 'none' },
      minted: { k: 'MINTED · TIER I', title: 'BBC Recruit carved', rows: [done('Base segment', 'bbc.totem.near #0413'), done('Head segment', 'quest complete'), open('Crown tier', 'unlocks at day 30 · branch by behavior')], cta: 'Simulate to day 30', next: 'choose', head: '#EDE6D8', crown: 'ghost' },
      choose: { k: 'DAY 30 · CROWN TIER', title: 'Your behavior picks the branch', rows: [], cta: '', head: '#EDE6D8', crown: 'ghost' },
      evolved: { k: `TIER III · ${bname.toUpperCase()}`, title: `Evolved into ${bname}`, rows: [done('Arena entry', 'Meme tournament round 2'), done('Council voice', 'Tier III = 3 votes'), done('Fee route visible', 'prizes 30 · treasury 30 · creator 25 · LP 15')], cta: '', head: '#EDE6D8', crown: bc }
    }[stage];
    return {
      kicker: M.k, title: M.title, rows: M.rows, cta: M.cta, hasCta: !!M.cta, act: () => set({ stage: M.next }),
      head: M.head, crown: M.crown, eye: stage === 'evolved' ? bc : G, wings: stage === 'evolved' ? bc : '',
      kickerS: { fontFamily: "'JetBrains Mono',monospace", fontSize: 13, letterSpacing: '0.06em', color: stage === 'evolved' ? bc : '#C9C3B6', marginTop: 22 },
      isChoose: stage === 'choose', notChoose: stage !== 'choose', isDone: stage === 'evolved',
      reset: () => set({ stage: 'quest', branch: null }),
      branches: [['commander', 'Meme Commander', '3 raids won · leading', O], ['diamond', 'Diamond Holder', 'streak 34 / 90d', G]].map(([id, name, why, c]) => ({ name, why, pick: () => set({ branch: id, stage: 'evolved' }), style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '16px 18px', background: '#141410', border: `1.5px solid ${c}`, borderRadius: 12, color: '#EDE6D8', cursor: 'pointer' } }))
    };
  }
}
</script>
</body>
</html>
